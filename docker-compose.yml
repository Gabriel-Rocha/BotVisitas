services:
  db:
    image: postgres:16-alpine
    container_name: botvisitas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botvisitas}
      POSTGRES_USER: ${POSTGRES_USER:-botvisitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botvisitas}
    volumes:
      - botvisitas_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Sandbox local na porta 3000 do host → o bot usa http://host.docker.internal:3000
  testpage:
    image: node:20-bookworm-slim
    container_name: botvisitas-testpage
    working_dir: /app
    volumes:
      - ./scripts/test-server.js:/app/test-server.js:ro
    command: ["node", "test-server.js"]
    ports:
      - "3000:3000"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botvisitas
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      testpage:
        condition: service_started
    # Sem env_file: TARGET_URLS e o resto vêm só do .env montado (dotenv no start).
    # Assim editar o arquivo no host + Stop/Start no dashboard aplica na hora.
    environment:
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      HEADLESS: "true"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "3847"
      # Dentro da rede Compose o host é o serviço "db"
      DATABASE_URL: postgres://${POSTGRES_USER:-botvisitas}:${POSTGRES_PASSWORD:-botvisitas}@db:5432/${POSTGRES_DB:-botvisitas}
      SNAPSHOT_INTERVAL_SEC: ${SNAPSHOT_INTERVAL_SEC:-10}
    ports:
      - "3847:3847"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    shm_size: "2gb"
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  botvisitas_pg_data:

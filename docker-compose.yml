services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botvisitas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      HEADLESS: "true"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "3847"
    ports:
      - "3847:3847"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    shm_size: "2gb"
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
